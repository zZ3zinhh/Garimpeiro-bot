# Backup bot: runs on GitHub every 15 minutes, but only does the real work
# when the PC has been silent for more than 25 minutes.
name: Backup bot

on:
  schedule:
    # GitHub drops many scheduled runs (it ran ~5 times a day instead of 96), especially
    # at :00, :15, :30 and :45 when everybody schedules. So we ask more often and at odd minutes.
    - cron: "2-57/5 * * * *"   # minutes 2, 7, 12, 17... (GitHub uses UTC time)
  workflow_dispatch:          # lets you (or the Supabase timer) start it from outside
    inputs:
      force:
        description: "Run even if the PC is working (for testing)"
        type: boolean
        default: false

# Never two backups at the same time (they could send the same alert twice).
concurrency:
  group: backup-bot
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BOT_RUNNER: github
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - run: pip install -r bot/requirements.txt

      - name: Is the PC still working?
        id: check
        run: python bot/should_run.py ${{ inputs.force && '--force' || '' }}

      - name: Run the bot
        if: steps.check.outputs.run == 'true'
        run: python bot/main.py
